<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bundle Deal – 3 für 5€</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    .flyer {
      width: 794px;
      height: 1123px;
      background: linear-gradient(160deg, #1a1a1a 0%, #0d0d0d 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #2a2a2a;
    }

    /* Background glow */
    .glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255,165,0,0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,80,0,0.1) 0%, transparent 70%);
      bottom: 50px;
      left: -80px;
      pointer-events: none;
    }

    /* Top stripe */
    .top-stripe {
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #ff6b00, #ffcc00, #ff6b00);
    }

    /* Header */
    .header {
      margin-top: 50px;
      text-align: center;
      z-index: 1;
    }

    .brand-tag {
      display: inline-block;
      background: rgba(255,107,0,0.15);
      border: 1px solid rgba(255,107,0,0.4);
      color: #ff9933;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 6px 20px;
      border-radius: 20px;
      margin-bottom: 30px;
    }

    .main-title {
      font-family: 'Bebas Neue', 'Impact', sans-serif;
      font-size: 110px;
      color: #ffffff;
      line-height: 0.9;
      letter-spacing: 2px;
    }

    .main-title span {
      color: #ff6b00;
    }

    .subtitle {
      font-size: 22px;
      color: #aaa;
      margin-top: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* Divider */
    .divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #ff6b00, transparent);
      margin: 40px auto;
      z-index: 1;
    }

    /* Products */
    .products {
      display: flex;
      gap: 30px;
      padding: 0 60px;
      z-index: 1;
      justify-content: center;
    }

    .product-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 35px 30px;
      text-align: center;
      flex: 1;
      position: relative;
      transition: all 0.3s;
    }

    .product-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff6b00, transparent);
      border-radius: 20px 20px 0 0;
    }

    .product-icon {
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 20px rgba(255,107,0,0.4));
    }

    .product-name {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .product-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    /* Plus sign */
    .plus {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: rgba(255,107,0,0.4);
      font-weight: 900;
      flex-shrink: 0;
      padding-top: 20px;
    }

    /* Price section */
    .price-section {
      z-index: 1;
      text-align: center;
      margin-top: 50px;
    }

    .price-badge {
      position: relative;
      display: inline-block;
    }

    .price-badge::before {
      content: '';
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle, rgba(255,107,0,0.2) 0%, transparent 70%);
      border-radius: 50%;
    }

    .price-label {
      font-size: 14px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 10px;
    }

    .price-main {
      font-family: 'Bebas Neue', 'Impact', sans-serif;
      font-size: 160px;
      line-height: 1;
      background: linear-gradient(135deg, #ff6b00, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(255,107,0,0.3));
    }

    .price-per {
      font-size: 16px;
      color: #555;
      margin-top: -10px;
      letter-spacing: 3px;
    }

    /* Highlight bar */
    .highlight-bar {
      margin-top: 40px;
      background: linear-gradient(90deg, #ff6b00, #ff9900);
      width: 100%;
      padding: 18px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }

    .highlight-text {
      font-size: 18px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .highlight-emoji {
      font-size: 24px;
    }

    /* Footer */
    .footer {
      z-index: 1;
      margin-top: auto;
      padding: 30px 60px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .footer-left {
      color: #444;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .footer-badge {
      background: rgba(255,107,0,0.1);
      border: 1px solid rgba(255,107,0,0.3);
      color: #ff6b00;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 20px;
      letter-spacing: 2px;
    }

    /* Bottom stripe */
    .bottom-stripe {
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #ff6b00, #ffcc00, #ff6b00);
    }
  </style>
</head>
<body>
  <div class="flyer">
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="top-stripe"></div>

    <div class="header">
      <div class="brand-tag">Exklusives Bundle</div>
      <div class="main-title">3 FÜR <span>5€</span></div>
      <div class="subtitle">Deal of the Day</div>
    </div>

    <div class="divider"></div>

    <div class="products">
      <div class="product-card">
        <span class="product-icon">🌿</span>
        <div class="product-name">Papes Filter</div>
        <div class="product-desc">Premium Aktivkohlefilter<br>für puren Genuss</div>
      </div>

      <div class="plus">+</div>

      <div class="product-card">
        <span class="product-icon">🔥</span>
        <div class="product-name">Feuerzeug</div>
        <div class="product-desc">Zuverlässig &amp; langlebig<br>immer dabei</div>
      </div>
    </div>

    <div class="price-section">
      <div class="price-label">Nur</div>
      <div class="price-badge">
        <div class="price-main">5€</div>
      </div>
      <div class="price-per">für 3 Stück · Solange Vorrat reicht</div>
    </div>

    <div class="highlight-bar">
      <span class="highlight-emoji">⚡</span>
      <span class="highlight-text">Jetzt zuschlagen &amp; sparen!</span>
      <span class="highlight-emoji">⚡</span>
    </div>

    <div class="footer">
      <div class="footer-left">LIMITIERTES ANGEBOT</div>
      <div class="footer-badge">TOP DEAL</div>
    </div>

    <div class="bottom-stripe"></div>
  </div>
</body>
</html>
