<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 595" width="420" height="595" style="font-family:Impact,Arial Black,sans-serif">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="60%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>
    <!-- Golden glow from box -->
    <radialGradient id="boxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff8c00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold shimmer -->
    <radialGradient id="goldShimmer" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#7a5800"/>
    </radialGradient>
    <!-- Red accent gradient -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2200"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <!-- Smoke filter -->
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="420" height="595" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.7">
    <circle cx="30" cy="20" r="1"/><circle cx="80" cy="15" r="0.8"/><circle cx="150" cy="8" r="1.2"/>
    <circle cx="200" cy="25" r="0.7"/><circle cx="270" cy="12" r="1"/><circle cx="340" cy="18" r="0.8"/>
    <circle cx="390" cy="10" r="1.1"/><circle cx="50" cy="45" r="0.6"/><circle cx="120" cy="35" r="0.9"/>
    <circle cx="310" cy="40" r="0.7"/><circle cx="370" cy="30" r="1"/><circle cx="410" cy="50" r="0.6"/>
    <circle cx="15" cy="70" r="0.8"/><circle cx="230" cy="50" r="0.6"/><circle cx="180" cy="60" r="1"/>
  </g>

  <!-- === CITY SKYLINE SILHOUETTE === -->
  <g fill="#080818" stroke="#1a1a3a" stroke-width="0.5">
    <!-- Left buildings -->
    <rect x="0" y="140" width="25" height="120"/>
    <rect x="5" y="120" width="15" height="20"/>
    <rect x="25" y="155" width="30" height="105"/>
    <rect x="30" y="135" width="10" height="20"/>
    <rect x="55" y="160" width="20" height="100"/>
    <rect x="58" y="145" width="6" height="15"/>
    <!-- Windows left -->
    <g fill="#1a2a4a" opacity="0.8">
      <rect x="8" y="125" width="4" height="4"/><rect x="14" y="125" width="4" height="4"/>
      <rect x="8" y="133" width="4" height="4"/><rect x="14" y="133" width="4" height="4"/>
      <rect x="27" y="140" width="4" height="4"/><rect x="34" y="140" width="4" height="4"/>
      <rect x="27" y="148" width="4" height="4"/><rect x="34" y="148" width="4" height="4"/>
    </g>
    <!-- Lit windows left -->
    <g fill="#ffd700" opacity="0.6">
      <rect x="14" y="133" width="3" height="3"/>
      <rect x="34" y="148" width="3" height="3"/>
    </g>

    <!-- Right buildings -->
    <rect x="335" y="150" width="35" height="110"/>
    <rect x="340" y="130" width="12" height="20"/>
    <rect x="365" y="160" width="25" height="100"/>
    <rect x="370" y="142" width="8" height="18"/>
    <rect x="385" y="145" width="35" height="115"/>
    <rect x="390" y="125" width="15" height="20"/>
    <!-- Windows right -->
    <g fill="#1a2a4a" opacity="0.8">
      <rect x="338" y="135" width="4" height="4"/><rect x="345" y="135" width="4" height="4"/>
      <rect x="338" y="143" width="4" height="4"/><rect x="345" y="143" width="4" height="4"/>
      <rect x="367" y="148" width="4" height="4"/><rect x="374" y="148" width="4" height="4"/>
    </g>
    <g fill="#ffd700" opacity="0.6">
      <rect x="345" y="143" width="3" height="3"/>
      <rect x="374" y="148" width="3" height="3"/>
    </g>

    <!-- Mid-far buildings -->
    <rect x="75" y="170" width="18" height="90"/>
    <rect x="93" y="178" width="22" height="82"/>
    <rect x="290" y="168" width="20" height="92"/>
    <rect x="310" y="175" width="28" height="85"/>
    <rect x="338" y="182" width="0" height="0"/>
    <!-- Church spire left -->
    <polygon points="100,120 107,165 93,165"/>
    <rect x="100" y="165" width="14" height="45"/>
    <!-- Church spire right -->
    <polygon points="315,115 322,162 308,162"/>
    <rect x="308" y="162" width="14" height="48"/>
  </g>

  <!-- Ground / street floor -->
  <rect x="0" y="255" width="420" height="340" fill="#0d0d0d"/>
  <!-- Ground line -->
  <line x1="0" y1="256" x2="420" y2="256" stroke="#1a1a2e" stroke-width="1"/>

  <!-- === GRAFFITI WALL === -->
  <!-- Wall texture -->
  <g opacity="0.3">
    <line x1="0" y1="270" x2="420" y2="270" stroke="#333" stroke-width="0.5"/>
    <line x1="0" y1="285" x2="420" y2="285" stroke="#333" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="420" y2="300" stroke="#333" stroke-width="0.5"/>
    <line x1="60" y1="256" x2="60" y2="595" stroke="#333" stroke-width="0.5"/>
    <line x1="180" y1="256" x2="180" y2="595" stroke="#333" stroke-width="0.5"/>
    <line x1="300" y1="256" x2="300" y2="595" stroke="#333" stroke-width="0.5"/>
  </g>
  <!-- Graffiti tag left -->
  <text x="18" y="500" font-size="28" font-family="Arial" font-weight="900" fill="#cc0022" opacity="0.25" transform="rotate(-15,18,500)" letter-spacing="2">SMOKE</text>
  <!-- Graffiti tag right -->
  <text x="290" y="520" font-size="22" font-family="Arial" font-weight="900" fill="#0044aa" opacity="0.2" transform="rotate(8,290,520)">SHoP</text>
  <!-- Tag lines -->
  <path d="M30,540 Q50,520 70,535 Q90,550 110,530" stroke="#8b0000" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- === GOLDEN GLOW FROM BOX (behind figure) === -->
  <ellipse cx="210" cy="350" rx="130" ry="100" fill="url(#boxGlow)" filter="url(#blur4)" opacity="0.8"/>
  <ellipse cx="210" cy="360" rx="80" ry="60" fill="#ffd700" filter="url(#blur4)" opacity="0.3"/>

  <!-- === HOODED FIGURE === -->
  <!-- Shadow on ground -->
  <ellipse cx="210" cy="555" rx="80" ry="15" fill="#000" opacity="0.6"/>

  <!-- Body / hoodie - main shape -->
  <!-- Legs -->
  <rect x="175" y="490" width="35" height="65" rx="5" fill="#111"/>
  <rect x="215" y="490" width="35" height="65" rx="5" fill="#0d0d0d"/>
  <!-- Shoes -->
  <ellipse cx="192" cy="555" rx="22" ry="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <ellipse cx="232" cy="555" rx="22" ry="8" fill="#222" stroke="#333" stroke-width="1"/>
  <!-- Shoe highlight -->
  <ellipse cx="185" cy="551" rx="10" ry="3" fill="#333" opacity="0.5"/>

  <!-- Hoodie body -->
  <path d="M140,480 Q135,420 145,380 Q160,340 180,330 L210,325 L240,330 Q260,340 275,380 Q285,420 280,480 Z" fill="#1c1c2e" stroke="#000" stroke-width="2.5"/>
  <!-- Hoodie darker areas -->
  <path d="M210,325 L210,480 Q180,475 175,490 L215,490 Q210,475 210,480 Z" fill="#141428" opacity="0.5"/>

  <!-- Hoodie pocket -->
  <path d="M175,430 Q178,415 210,412 Q242,415 245,430 L245,460 Q242,468 210,468 Q178,468 175,460 Z" fill="#161626" stroke="#000" stroke-width="1.5"/>

  <!-- LEFT ARM - holding box out toward viewer -->
  <path d="M145,380 Q120,390 105,410 Q95,425 100,445 Q108,460 125,458 Q140,456 155,440 L170,420 Q160,400 155,385 Z" fill="#1c1c2e" stroke="#000" stroke-width="2"/>
  <!-- Left hand -->
  <ellipse cx="115" cy="452" rx="18" ry="14" fill="#c8a882" stroke="#000" stroke-width="1.5"/>
  <!-- Fingers suggestion -->
  <path d="M103,446 Q108,440 115,438 Q122,440 127,446" stroke="#8b6947" stroke-width="1" fill="none"/>

  <!-- RIGHT ARM - flipping lighter -->
  <path d="M275,380 Q295,388 308,405 Q318,420 315,440 Q310,455 298,455 Q285,452 278,440 L268,420 Q268,398 270,382 Z" fill="#1c1c2e" stroke="#000" stroke-width="2"/>
  <!-- Right hand -->
  <ellipse cx="305" cy="448" rx="16" ry="13" fill="#c8a882" stroke="#000" stroke-width="1.5"/>

  <!-- LIGHTER in right hand -->
  <rect x="296" y="420" width="18" height="28" rx="3" fill="#cc2200" stroke="#000" stroke-width="1.5"/>
  <rect x="298" y="418" width="14" height="8" rx="2" fill="#888"/>
  <!-- Flame -->
  <path d="M305,415 Q308,408 305,400 Q302,406 299,410 Q297,413 300,416 Q303,418 305,415" fill="#ffd700"/>
  <path d="M305,413 Q307,407 305,402 Q303,407 302,411 Q302,414 304,415 Z" fill="#fff" opacity="0.7"/>
  <!-- Flame glow -->
  <ellipse cx="305" cy="408" rx="8" ry="10" fill="#ff6600" filter="url(#blur2)" opacity="0.6"/>

  <!-- NECK & HEAD -->
  <rect x="198" y="305" width="24" height="28" rx="4" fill="#c8a882" stroke="#000" stroke-width="1.5"/>

  <!-- Head shape -->
  <ellipse cx="210" cy="290" rx="38" ry="42" fill="#c8a882" stroke="#000" stroke-width="2"/>
  <!-- Face shadow -->
  <path d="M185,280 Q190,270 210,268 Q230,270 235,280 Q235,300 210,308 Q185,300 185,280" fill="#b8946a" opacity="0.4"/>

  <!-- SUNGLASSES -->
  <rect x="188" y="282" width="22" height="13" rx="5" fill="#111" stroke="#ffd700" stroke-width="1.5"/>
  <rect x="212" y="282" width="22" height="13" rx="5" fill="#111" stroke="#ffd700" stroke-width="1.5"/>
  <line x1="210" y1="288" x2="212" y2="288" stroke="#ffd700" stroke-width="1.5"/>
  <line x1="188" y1="288" x2="180" y2="290" stroke="#ffd700" stroke-width="1.5"/>
  <line x1="234" y1="288" x2="242" y2="290" stroke="#ffd700" stroke-width="1.5"/>
  <!-- Lens shine -->
  <path d="M191,284 Q196,283 198,286" stroke="white" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M215,284 Q220,283 222,286" stroke="white" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Nose & mouth suggestion -->
  <path d="M207,298 Q210,302 213,298" stroke="#a07050" stroke-width="1.2" fill="none"/>

  <!-- HOODIE HOOD up -->
  <path d="M172,295 Q168,260 175,240 Q185,220 210,218 Q235,220 245,240 Q252,260 248,295 Q238,278 210,275 Q182,278 172,295 Z" fill="#1c1c2e" stroke="#000" stroke-width="2.5"/>
  <!-- Hood inner shadow -->
  <path d="M178,295 Q180,265 190,248 Q200,235 210,233 Q220,235 230,248 Q240,265 242,295 Q232,282 210,280 Q188,282 178,295 Z" fill="#141428"/>

  <!-- GOLD CHAIN -->
  <path d="M185,335 Q210,350 235,335" stroke="#ffd700" stroke-width="3" fill="none"/>
  <path d="M185,335 Q210,350 235,335" stroke="#ffaa00" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Chain links -->
  <g fill="#ffd700" stroke="#aa7700" stroke-width="0.5">
    <ellipse cx="193" cy="338" rx="4" ry="2.5" transform="rotate(-20,193,338)"/>
    <ellipse cx="202" cy="343" rx="4" ry="2.5" transform="rotate(-5,202,343)"/>
    <ellipse cx="210" cy="345" rx="4" ry="2.5"/>
    <ellipse cx="218" cy="343" rx="4" ry="2.5" transform="rotate(5,218,343)"/>
    <ellipse cx="227" cy="338" rx="4" ry="2.5" transform="rotate(20,227,338)"/>
  </g>
  <!-- Pendant -->
  <polygon points="210,355 206,362 210,366 214,362" fill="#ffd700" stroke="#aa7700" stroke-width="1"/>

  <!-- === GLOWING PRODUCT BOX === -->
  <!-- Box glow halo -->
  <ellipse cx="138" cy="452" rx="55" ry="40" fill="#ffd700" filter="url(#blur4)" opacity="0.35"/>

  <!-- Box body -->
  <path d="M88,440 Q87,415 100,410 L178,408 Q190,410 190,435 L190,468 Q190,475 178,476 L100,476 Q88,475 88,468 Z" fill="#2a1a00" stroke="#000" stroke-width="2"/>
  <!-- Box front face -->
  <rect x="90" y="435" width="98" height="40" rx="4" fill="#3a2200" stroke="#ffd700" stroke-width="1.5"/>
  <!-- Box gold rim -->
  <rect x="90" y="435" width="98" height="3" rx="1" fill="#ffd700" opacity="0.8"/>
  <rect x="90" y="472" width="98" height="3" rx="1" fill="#ffd700" opacity="0.8"/>

  <!-- Inner glow -->
  <rect x="92" y="437" width="94" height="36" rx="3" fill="url(#boxGlow)" opacity="0.6"/>

  <!-- ROLLING PAPERS in box -->
  <rect x="98" y="440" width="22" height="30" rx="2" fill="#f5f0e0" stroke="#ccc" stroke-width="1"/>
  <rect x="100" y="442" width="18" height="5" rx="1" fill="#ff8800"/>
  <text x="109" y="448" font-size="5" fill="white" font-family="Arial" font-weight="bold" text-anchor="middle">OCB</text>
  <line x1="100" y1="450" x2="118" y2="450" stroke="#ccc" stroke-width="0.5"/>
  <line x1="100" y1="453" x2="118" y2="453" stroke="#ccc" stroke-width="0.5"/>
  <line x1="100" y1="456" x2="118" y2="456" stroke="#ccc" stroke-width="0.5"/>
  <line x1="100" y1="459" x2="118" y2="459" stroke="#ccc" stroke-width="0.5"/>
  <line x1="100" y1="462" x2="118" y2="462" stroke="#ccc" stroke-width="0.5"/>
  <line x1="100" y1="465" x2="118" y2="465" stroke="#ccc" stroke-width="0.5"/>

  <!-- FILTER PACK in box -->
  <rect x="125" y="441" width="26" height="28" rx="2" fill="#e8e8e8" stroke="#aaa" stroke-width="1"/>
  <rect x="127" y="443" width="22" height="8" rx="1" fill="#2255aa"/>
  <text x="138" y="449" font-size="4.5" fill="white" font-family="Arial" font-weight="bold" text-anchor="middle">AKTIS</text>
  <rect x="127" y="452" width="22" height="15" rx="1" fill="#ddd"/>
  <text x="138" y="459" font-size="4" fill="#333" font-family="Arial" text-anchor="middle">Aktivkohle</text>
  <text x="138" y="464" font-size="4" fill="#333" font-family="Arial" text-anchor="middle">Filter</text>

  <!-- SMALL LIGHTER in box -->
  <rect x="157" y="445" width="13" height="23" rx="3" fill="#cc2200" stroke="#000" stroke-width="1"/>
  <rect x="159" y="443" width="9" height="6" rx="1" fill="#777"/>
  <path d="M163,441 Q165,437 163,433 Q161,437 159,440 Q161,442 163,441" fill="#ffd700"/>

  <!-- Box shine/sparkles -->
  <g fill="#ffd700" filter="url(#blur2)">
    <circle cx="95" cy="432" r="2" opacity="0.8"/>
    <circle cx="185" cy="430" r="2" opacity="0.8"/>
    <circle cx="190" cy="470" r="1.5" opacity="0.6"/>
  </g>
  <!-- Star sparkles -->
  <g fill="#ffd700" stroke="#ffd700">
    <path d="M82,428 L83,424 L84,428 L88,429 L84,430 L83,434 L82,430 L78,429 Z" stroke-width="0.3"/>
    <path d="M196,425 L197,422 L198,425 L201,426 L198,427 L197,430 L196,427 L193,426 Z" stroke-width="0.3"/>
  </g>

  <!-- === SMOKE CLOUDS === -->
  <!-- Left smoke -->
  <g opacity="0.6" fill="#334455" filter="url(#blur2)">
    <ellipse cx="60" cy="350" rx="45" ry="35"/>
    <ellipse cx="35" cy="330" rx="35" ry="28"/>
    <ellipse cx="25" cy="305" rx="28" ry="22"/>
    <ellipse cx="15" cy="282" rx="22" ry="18"/>
    <ellipse cx="50" cy="295" rx="30" ry="24"/>
    <ellipse cx="70" cy="278" rx="25" ry="20"/>
  </g>
  <!-- Right smoke -->
  <g opacity="0.6" fill="#334455" filter="url(#blur2)">
    <ellipse cx="360" cy="345" rx="45" ry="35"/>
    <ellipse cx="385" cy="325" rx="35" ry="28"/>
    <ellipse cx="400" cy="300" rx="28" ry="22"/>
    <ellipse cx="410" cy="278" rx="22" ry="18"/>
    <ellipse cx="370" cy="290" rx="30" ry="24"/>
    <ellipse cx="350" cy="275" rx="25" ry="20"/>
  </g>
  <!-- Top center smoke wisps -->
  <g opacity="0.4" fill="#556677" filter="url(#blur2)">
    <ellipse cx="210" cy="160" rx="80" ry="50"/>
    <ellipse cx="180" cy="140" rx="55" ry="38"/>
    <ellipse cx="240" cy="138" rx="55" ry="38"/>
    <ellipse cx="155" cy="125" rx="40" ry="28"/>
    <ellipse cx="265" cy="123" rx="40" ry="28"/>
    <ellipse cx="210" cy="115" rx="65" ry="40"/>
  </g>

  <!-- === SMOKE PACK TITLE === -->
  <!-- Smoke/cloud letters outline behind -->
  <g filter="url(#blur2)" opacity="0.5">
    <text x="210" y="110" font-size="72" font-family="Impact,Arial Black,sans-serif" fill="#8899aa" text-anchor="middle" letter-spacing="4">SMOKE</text>
    <text x="210" y="175" font-size="72" font-family="Impact,Arial Black,sans-serif" fill="#8899aa" text-anchor="middle" letter-spacing="6">PACK</text>
  </g>
  <!-- Main title stroke (black outline) -->
  <text x="210" y="110" font-size="68" font-family="Impact,Arial Black,sans-serif" fill="none" stroke="#000" stroke-width="8" text-anchor="middle" letter-spacing="3">SMOKE</text>
  <text x="210" y="175" font-size="68" font-family="Impact,Arial Black,sans-serif" fill="none" stroke="#000" stroke-width="8" text-anchor="middle" letter-spacing="5">PACK</text>
  <!-- Main title fill - white/cream -->
  <text x="210" y="110" font-size="68" font-family="Impact,Arial Black,sans-serif" fill="#f0ede0" text-anchor="middle" letter-spacing="3">SMOKE</text>
  <text x="210" y="175" font-size="68" font-family="Impact,Arial Black,sans-serif" fill="#f0ede0" text-anchor="middle" letter-spacing="5">PACK</text>
  <!-- Title subtle cloud texture (overlapping circles) -->
  <g fill="#f0ede0" opacity="0.08">
    <ellipse cx="140" cy="88" rx="15" ry="12"/><ellipse cx="160" cy="82" rx="18" ry="14"/>
    <ellipse cx="185" cy="80" rx="20" ry="15"/><ellipse cx="210" cy="80" rx="20" ry="15"/>
    <ellipse cx="235" cy="80" rx="20" ry="15"/><ellipse cx="260" cy="82" rx="18" ry="14"/>
    <ellipse cx="280" cy="88" rx="15" ry="12"/>
  </g>

  <!-- === PRICE BADGE === -->
  <!-- Outer glow -->
  <ellipse cx="210" cy="225" rx="65" ry="45" fill="#ffd700" filter="url(#blur4)" opacity="0.4"/>
  <!-- Badge shape -->
  <polygon points="210,185 225,195 242,192 248,208 262,218 255,233 258,250 242,254 232,267 210,262 188,267 178,254 162,250 165,233 158,218 172,208 178,192 195,195" fill="url(#goldShimmer)" stroke="#000" stroke-width="2.5"/>
  <!-- Inner badge -->
  <polygon points="210,192 222,200 236,197 241,210 253,218 247,231 250,245 236,248 228,259 210,255 192,259 184,248 170,245 173,231 167,218 179,210 184,197 198,200" fill="#ffd700" opacity="0.3"/>
  <!-- Price text stroke -->
  <text x="210" y="242" font-size="46" font-family="Impact,Arial Black,sans-serif" fill="none" stroke="#000" stroke-width="6" text-anchor="middle">5€</text>
  <!-- Price text fill -->
  <text x="210" y="242" font-size="46" font-family="Impact,Arial Black,sans-serif" fill="#ffd700" text-anchor="middle" filter="url(#goldGlow)">5€</text>

  <!-- === BOTTOM PRODUCT TEXT === -->
  <!-- Dark strip -->
  <rect x="0" y="565" width="420" height="30" fill="#0a0a0a" opacity="0.9"/>
  <line x1="0" y1="565" x2="420" y2="565" stroke="#ffd700" stroke-width="1.5"/>
  <!-- Product text -->
  <text x="210" y="585" font-size="16" font-family="Arial,sans-serif" font-weight="900" fill="#f0ede0" text-anchor="middle" letter-spacing="3">Papes + Aktis + Feuer</text>
  <!-- Bullet decorators -->
  <text x="50" y="584" font-size="12" fill="#ffd700" text-anchor="middle">✦</text>
  <text x="370" y="584" font-size="12" fill="#ffd700" text-anchor="middle">✦</text>

  <!-- === BORDER / FRAME === -->
  <rect x="4" y="4" width="412" height="587" rx="4" fill="none" stroke="#cc2200" stroke-width="3"/>
  <rect x="8" y="8" width="404" height="579" rx="3" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.4"/>

  <!-- Corner accents -->
  <g stroke="#ffd700" stroke-width="2" fill="none">
    <path d="M4,30 L4,4 L30,4"/>
    <path d="M390,4 L416,4 L416,30"/>
    <path d="M4,565 L4,591 L30,591"/>
    <path d="M390,591 L416,591 L416,565"/>
  </g>
</svg>
